<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Harmonic Heat · Team Sunders</title>
    <link rel="icon" type="image/png" href="./favicon-v3.png" />
    <meta name="theme-color" content="#000000" />
    <link rel="preload" as="image" href="./brand/planet-loading-v3.png" />
    <!-- Loading screen: plain HTML and CSS so it shows before the app's JavaScript has arrived.
         src/components/BootScreen.tsx drives the progress bar and removes it once the map is drawn. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 1000; background: #000; color: #f3efe8; display: flex;
        flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px;
        font-family: "Times New Roman", Times, serif; transition: opacity 0.45s ease; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot img { width: min(272px, 62vw); height: auto; }
      #boot .boot-title { font-size: 26px; font-weight: 600; letter-spacing: 0.01em; margin-top: 6px; text-align: center; }
      #boot .boot-sub { font-size: 16px; color: #b9b7cc; text-align: center; margin-top: -10px; }
      #boot .boot-bar { width: min(420px, 80vw); height: 6px; border-radius: 3px; background: #1d2240; overflow: hidden; }
      #boot .boot-fill { height: 100%; width: 3%; border-radius: 3px; background: linear-gradient(90deg, #d9641f, #ff9a5c);
        transition: width 0.25s ease; }
      #boot .boot-status { font: 400 15px "Times New Roman", Times, serif; color: #9896ae; min-height: 1.4em; text-align: center; }
      @media (prefers-reduced-motion: reduce) { #boot, #boot .boot-fill { transition: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <img src="./brand/planet-loading-v3.png" alt="Team Sunders" width="368" height="368" />
      <div class="boot-title">Harmonic Heat</div>
      <div class="boot-sub">A NASA Space Apps Challenge 2026 project by team Sunders</div>
      <div class="boot-bar" aria-hidden="true"><div class="boot-fill"></div></div>
      <div class="boot-status">Starting…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
